[package]
name = "graphify_snap"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "graphify_snap"
crate-type = ["cdylib"]

[dependencies]
snap-core = { path = "../snap-core" }
# No abi3: zero-copy views need the buffer protocol, which the limited API
# exposes only from 3.11; the spike builds for its own interpreter.
pyo3 = { version = "0.25", features = ["extension-module"] }
