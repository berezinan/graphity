[package]
name = "snap-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
memmap2 = "0.9"
memchr = "2"
rustc-hash = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"
